project_name: zones-operator

env:
  - DOCKER_IMAGE_REPO={{ envOrDefault "DOCKER_IMAGE_REPO" "zones-operator" }}

builds:
  - id: operator
    binary: operator
    main: main.go
    goos:
      - linux
    goarch:
      - amd64
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/zeiss/zones-operator/main.version={{.Version}} -X github.com/zeiss/zones-operator/main.commit={{.Commit}} -X github.com/zeiss/zones-operator/main.date={{.Date}}

archives:
  - id: operator
    builds:
      - operator
    name_template: "operator_{{.Version}}_{{.Os}}_{{.Arch}}"

dockers_v2:
  - id: builder
    dockerfile: Dockerfile
    images:
      - "{{ .Env.DOCKER_IMAGE_REPO }}/operator"
    tags:
      - "{{ .Version }}"
      - latest
    ids:
      - builder
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"

gomod:
  proxy: false

release:
  draft: false

changelog:
  groups:
     - title: Features
       regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
       order: 0
     - title: "Bug fixes"
       regexp: '^.*?bug(\([[:word:]]+\))??!?:.+$'
       order: 1
     - title: Others
       order: 999
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - typo
      - (?i)foo

snapshot:
  name_template: "{{.Tag}}"

checksum:
  name_template: "operator_checksums.txt"
