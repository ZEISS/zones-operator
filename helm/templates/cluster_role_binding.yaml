apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "zones-operator.fullname" . }}-manager-rolebinding
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: zones-operator
    app.kubernetes.io/part-of: zones-operator
  {{- include "zones-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "zones-operator.fullname" . }}-manager-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "zones-operator.fullname" . }}-controller-manager'
  namespace: '{{ .Release.Namespace }}'
